name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v16
      - name: Run native tests
        run: ./tests/run.sh
      - name: Build and test WebAssembly simulator
        run: ./tools/build-wasm.sh && node tests/test_wasm.mjs

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Build ESP32 firmware
        run: ./build.sh
      - name: Build ESP32 device-test firmware
        run: ./build.sh --device-test
